<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%" height="60" preserveAspectRatio="none">
  <defs>
    <filter id="ribbonShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <g filter="url(#ribbonShadow)">
    <!-- Saffron Wave (Top) -->
    <path d="M 0 35 Q 300 10 600 32 T 1200 20 L 1200 30 Q 900 42 600 42 T 0 45 Z" fill="#FF9933" />
    <!-- White Wave (Middle) -->
    <path d="M 0 45 Q 300 20 600 42 T 1200 30 L 1200 40 Q 900 52 600 52 T 0 55 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.5" />
    <!-- Green Wave (Bottom) -->
    <path d="M 0 55 Q 300 30 600 52 T 1200 40 L 1200 60 L 0 60 Z" fill="#138808" />
  </g>
</svg>

