<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="goldWatermark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5832B" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#E8B868" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#C5832B" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#goldWatermark)" stroke-width="1.5">
    <!-- Outer Rings -->
    <circle cx="200" cy="200" r="190" stroke-width="2" />
    <circle cx="200" cy="200" r="182" stroke-dasharray="3,3" />
    <circle cx="200" cy="200" r="160" />
    <circle cx="200" cy="200" r="135" />
    <circle cx="200" cy="200" r="95" stroke-width="2" />
    <circle cx="200" cy="200" r="50" />
    <circle cx="200" cy="200" r="22" fill="#E8B868" fill-opacity="0.05" />

    <!-- 16 Sun/Chakra Spokes -->
    <g stroke-width="1.2">
      <line x1="200" y1="10" x2="200" y2="390" />
      <line x1="10" y1="200" x2="390" y2="200" />
      <line x1="66" y1="66" x2="334" y2="334" />
      <line x1="66" y1="334" x2="334" y2="66" />

      <line x1="127" y1="24" x2="273" y2="376" />
      <line x1="273" y1="24" x2="127" y2="376" />
      <line x1="24" y1="127" x2="376" y2="273" />
      <line x1="24" y1="273" x2="376" y2="127" />
    </g>

    <!-- Decorative Petals on Outer Rim -->
    <g stroke="url(#goldWatermark)" fill="#E8B868" fill-opacity="0.04">
      <circle cx="200" cy="40" r="10" />
      <circle cx="200" cy="360" r="10" />
      <circle cx="40" cy="200" r="10" />
      <circle cx="360" cy="200" r="10" />
      <circle cx="87" cy="87" r="10" />
      <circle cx="313" cy="313" r="10" />
      <circle cx="87" cy="313" r="10" />
      <circle cx="313" cy="87" r="10" />
    </g>
  </g>
</svg>

